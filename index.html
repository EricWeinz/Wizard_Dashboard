<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050311" />
    <!-- Gewähltes Farbdesign vor dem ersten Bild setzen, damit nichts aufblitzt -->
    <script>
      try {
        var t = localStorage.getItem("wizard:theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html { background: #050311; }
      html[data-theme="feuer"] { background: #0c0402; } html[data-theme="eis"] { background: #020810; }
      html[data-theme="druide"] { background: #020a05; } html[data-theme="gold"] { background: #050504; }
      html[data-theme="neon"] { background: #06020e; } html[data-theme="pergament"] { background: #ecdfbe; }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>" />
    <title>Wizard Score Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
